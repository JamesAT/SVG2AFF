<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to .aff Converter</title>
    <!-- opentype.js for Text-to-Path Vectorization -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js" defer></script>
    <!-- DOMPurify for sanitizing user-provided SVGs -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="studio-layout">
    <!-- Left Panel: Settings and Transformations -->
    <aside class="panel" id="leftPanel" style="width: 280px;">
        <header>
            <span>SETTINGS</span>
            <div class="header-actions">
                <button class="icon-btn" data-action="undo" data-tooltip="Undo last change (Ctrl+Z)">↺</button>
                <button class="icon-btn" data-action="redo" data-tooltip="Redo last undone change (Ctrl+Y)">↻</button>
                <button class="icon-btn" data-action="toggleSettings" data-tooltip="Open Preferences & Dedicated Settings Menu">⚙</button>
                <button class="icon-btn danger-btn" data-action="factoryReset" data-tooltip="Clear cache & reset everything to factory defaults">🗑</button>
                <button class="icon-btn" data-action="toggleAbout" data-tooltip="Version, credits and info">ℹ</button>
            </div>
        </header>
        <div class="scroll-content">
            
            <!-- Workspace Mode Switcher -->
            <div class="ctrl-card" data-tooltip="Switch between Simple (Single SVG) and Advanced (Photoshop Layers) workflow modes">
                <label>Workspace Mode</label>
                <select id="workspaceModeSelect">
                    <option value="single">Single SVG Mode (Simple)</option>
                    <option value="layers">Layers Mode (Photoshop Style)</option>
                </select>
            </div>

            <!-- Accessibility & Tooltips Toggle -->
            <div class="ctrl-card">
                <label class="checkbox-label" style="margin-bottom: 8px;" data-tooltip="Toggle popup hints when hovering over controls">
                    <input type="checkbox" id="toggleTooltipsLeft" checked>
                    <span>Show Hover Hints</span>
                </label>
                <label class="checkbox-label" data-tooltip="Use high-contrast colorblind-safe palette (dynamic for light/dark themes)">
                    <input type="checkbox" id="colorblindToggle">
                    <span>Colorblind / High-Contrast</span>
                </label>
            </div>

            <!-- Theme Picker -->
            <div class="ctrl-card" data-tooltip="Change workspace color theme">
                <label>Theme</label>
                <select id="themeSelect">
                    <optgroup label="Dark Themes">
                        <option value="defaultTheme">Default</option>
                        <option value="cyberpunk">Cyberpunk Cyan</option>
                        <option value="oled">OLED Pitch Black</option>
                        <option value="synthwave">Synthwave Neon</option>
                    </optgroup>
                    <optgroup label="Light Themes">
                        <option value="minimalLight">Minimalist Light</option>
                        <option value="sakura">Sakura Blossom</option>
                        <option value="slateLight">Clean Slate</option>
                        <option value="solarizedLight">Solarized Light</option>
                    </optgroup>
                    <optgroup label="Saved Custom Themes" id="savedCustomThemesGroup">
                        <!-- Dynamically populated from LocalStorage -->
                    </optgroup>
                    <optgroup label="Custom Editor">
                        <option value="custom">Custom Theme...</option>
                    </optgroup>
                </select>

                <div id="customThemePicker" style="display: none;" class="color-grid">
                    <div class="color-item" style="grid-column: span 2;">
                        <span>Theme Name</span>
                        <input type="text" id="customThemeName" value="My Custom Theme" placeholder="Theme Name" style="padding: 4px; font-size: 11px;">
                    </div>
                    <div class="color-item" style="grid-column: span 2;">
                        <span>Theme Mode / Accent Tint</span>
                        <select id="customThemeMode" style="padding: 4px; font-size: 10px;">
                            <option value="auto">Auto (Detect Background)</option>
                            <option value="dark">Dark Mode Base</option>
                            <option value="light">Light Mode Base</option>
                        </select>
                    </div>
                    <div class="color-item">
                        <span>Accent</span>
                        <input type="color" id="customAccent" value="#7654ff">
                    </div>
                    <div class="color-item">
                        <span>Background</span>
                        <input type="color" id="customBg" value="#0a0a0c">
                    </div>
                    <div class="color-item">
                        <span>Cards/Panels</span>
                        <input type="color" id="customCard" value="#1c1c24">
                    </div>
                    <div class="color-item">
                        <span>Playfield</span>
                        <input type="color" id="customPlayfield" value="#00ff66">
                    </div>
                    <div class="color-item" style="grid-column: span 2;">
                        <span>Text Color</span>
                        <input type="color" id="customText" value="#e1e1e6">
                    </div>
                    <div style="grid-column: span 2; display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap;">
                        <button class="secondary sm" style="flex: 1;" id="saveThemeBtn">Save Theme</button>
                        <button class="danger-btn sm" style="flex: 1;" id="deleteThemeBtn">Delete Theme</button>
                        <button class="secondary sm" style="flex: 1;" id="exportThemeBtn">Export JSON</button>
                        <button class="secondary sm" style="flex: 1;" id="importThemeBtn">Import JSON</button>
                        <input type="file" id="importThemeFile" accept=".json" style="display:none">
                    </div>
                </div>
            </div>

            <!-- Active Layer Indicator -->
            <div id="transformLabelHeader" style="font-size: 9px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;">
                Vector Transform (<span id="activeLayerNameLabel">Main Path</span>)
            </div>

            <div class="ctrl-card" data-tooltip="Start timestamp for generated arcs in milliseconds">
                <label>Base Timing (ms)</label>
                <input type="number" id="baseTime" value="1000">
            </div>

            <div class="ctrl-card">
                <div class="checkbox-row" style="margin-bottom: 8px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <label style="margin-bottom: 0;">Scale</label>
                        <button class="secondary sm" id="resetScaleBtn" style="padding: 2px 6px; font-size: 9px;" data-tooltip="Reset Scale X and Y to equal default size (0.050)">Reset 1:1</button>
                    </div>
                    <label class="checkbox-label" data-tooltip="Keep X and Y proportions equal while scaling">
                        <input type="checkbox" id="linkScale" checked>
                        <span>Link X/Y</span>
                    </label>
                </div>
                <label data-tooltip="Horizontal scale factor">Scale X <span class="val-display" id="v_scaleX">0.050</span></label>
                <input type="range" id="scaleX" min="0.000001" max="1.0" step="0.000001" value="0.05">
                <label style="margin-top: 10px;" data-tooltip="Vertical scale factor">Scale Y <span class="val-display" id="v_scaleY">0.050</span></label>
                <input type="range" id="scaleY" min="0.000001" max="1.0" step="0.000001" value="0.05">
            </div>

            <!-- Rotation Control with Dedicated Reset Button -->
            <div class="ctrl-card" data-tooltip="Rotate path (-180° to +180°)">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin-bottom: 0;">Rotation <span class="val-display" id="v_rot">0</span>°</label>
                    <button class="secondary sm" id="resetRotBtn" style="padding: 2px 6px; font-size: 9px;" data-tooltip="Reset rotation angle to 0°">Reset 0°</button>
                </div>
                <input type="range" id="rotation" min="-180" max="180" step="1" value="0">
            </div>

            <!-- ... Rest of UI unchanged (omitted for brevity) ... -->

        </div>
    </aside>
</div>

<div class="tooltip" id="tooltip"></div>
<svg style="display:none;"><path id="pathHelper"></path></svg>

<!-- Utilities and main boot scripts -->
<script src="js/utils.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
